<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>banner</title>
<!--
  Banner do canal, 2560x1440. Edite e rode, de dentro da pasta: node <skill>/scripts/gerar_identidade.mjs
  O que precisa ser lido fica dentro de #seguro (1546x423 no centro), a única parte que todo aparelho mostra.
  No computador aparece a faixa de 2560x423 do meio; o banner inteiro, só na TV.
  Regras e como conferir: <skill>/references/identidade.md
-->
<style>
  /* cores do perfil do canal (canais/<slug>.md, "Identidade visual") */
  :root { --acento: #FFC400; --fundo: #000; --texto: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: var(--fundo);
    font-family: 'Segoe UI', 'Inter', Arial, sans-serif; color: var(--texto); }
  #banner { position: relative; width: 2560px; height: 1440px; overflow: hidden; }

  /* imagem de fundo opcional (uma ilustração gerada no Gemini, um quadro de vídeo): escurecida para o texto ler */
  #imagem { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.5) contrast(1.1); }
  /* holofote no centro, o mesmo clima dos vídeos */
  #luz { position: absolute; inset: 0;
    background: radial-gradient(ellipse 1150px 560px at 50% 50%, rgba(255,255,255,.17), transparent 70%); }
  /* linha fina na altura da faixa do computador, para o banner não parecer cortado por acaso */
  #linhas { position: absolute; left: 0; right: 0; top: 520px; height: 400px;
    border-top: 2px solid rgba(255,255,255,.12); border-bottom: 2px solid rgba(255,255,255,.12); }

  #seguro { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #nome { font-weight: 900; font-size: 150px; line-height: .95; letter-spacing: -3px; text-transform: uppercase;
    white-space: nowrap; text-shadow: 0 8px 40px rgba(0,0,0,.9); }
  #nome .acento { color: var(--acento); }
  #frase { margin-top: 30px; font-size: 42px; font-weight: 600; letter-spacing: 8px; text-transform: uppercase; opacity: .85;
    white-space: nowrap; }

  /* marca do canal: as mesmas cantoneiras das thumbs, nos cantos da área segura */
  #marca { position: absolute; inset: 24px; pointer-events: none; }
  #marca i { position: absolute; width: 60px; height: 60px; border: 8px solid var(--acento); }
  #marca i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #marca i:nth-child(2) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #marca i:nth-child(3) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
</style>
</head>
<body>
<div id="banner">
  <!-- <img id="imagem" src="fundo.png" alt=""> -->
  <div id="luz"></div>
  <div id="linhas"></div>
  <div id="seguro">
    <div id="marca"><i></i><i></i><i></i></div>
    <div id="nome" data-seguro>NOME DO <span class="acento">CANAL</span></div>
    <div id="frase" data-seguro>A frase do canal</div>
  </div>
</div>
</body>
</html>

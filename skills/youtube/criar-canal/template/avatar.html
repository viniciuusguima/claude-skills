<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>avatar</title>
<!--
  Foto de perfil do canal, 800x800. Edite e rode, de dentro da pasta: node <skill>/scripts/gerar_identidade.mjs
  O YouTube corta em círculo e mostra pequena (98 px na página do canal, 40 px nos comentários e no feed):
  um elemento só, grande, no centro. Regras: <skill>/references/identidade.md
-->
<style>
  /* cores do perfil do canal (canais/<slug>.md, "Identidade visual") */
  :root { --acento: #FFC400; --fundo: #000; --texto: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 800px; height: 800px; overflow: hidden; background: var(--fundo);
    font-family: 'Segoe UI', 'Inter', Arial, sans-serif; color: var(--texto); }
  #avatar { position: relative; width: 800px; height: 800px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  #imagem { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #luz { position: absolute; inset: 0;
    background: radial-gradient(circle 360px at 50% 45%, rgba(255,255,255,.22), transparent 72%); }

  /* anel na cor de destaque: dá contorno à foto no tema escuro e no claro do YouTube */
  #anel { position: absolute; inset: 12px; border-radius: 50%; border: 14px solid var(--acento); }

  /* sigla: duas letras no máximo, a segunda na cor de destaque */
  #sigla { position: relative; font-weight: 900; font-size: 300px; line-height: 1; letter-spacing: -10px;
    text-shadow: 0 8px 30px rgba(0,0,0,.9); }
  #sigla .acento { color: var(--acento); }

  /* marca do canal: as cantoneiras, dentro do círculo */
  #marca { position: absolute; left: 170px; top: 170px; width: 460px; height: 460px; pointer-events: none; }
  #marca i { position: absolute; width: 56px; height: 56px; border: 12px solid var(--acento); }
  #marca i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #marca i:nth-child(2) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #marca i:nth-child(3) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
</style>
</head>
<body>
<div id="avatar">
  <!-- <img id="imagem" src="avatar_fundo.png" alt=""> -->
  <div id="luz"></div>
  <div id="anel"></div>
  <div id="marca"><i></i><i></i><i></i></div>
  <div id="sigla" data-seguro>N<span class="acento">C</span></div>
</div>
</body>
</html>
